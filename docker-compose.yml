# PostgreSQL for development, pinned to one minor release for the whole project.
# Start:  docker compose up -d
# Stop:   docker compose down          (data is kept in the pgdata volume)
# Wipe:   docker compose down -v       (deletes the volume; rebuild.py recreates everything anyway)

services:
  db:
    image: postgres:18.6
    container_name: esports-db
    environment:
      POSTGRES_USER: ${PGUSER:-esports}
      POSTGRES_PASSWORD: ${PGPASSWORD:-esports_dev}
      POSTGRES_DB: postgres
    ports:
      - "${PGPORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18/docker,
      # so the volume is mounted one level up.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-esports} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
